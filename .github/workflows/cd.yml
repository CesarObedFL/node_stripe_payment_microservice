name: CD - Payment Microservice

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Storage to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'logs' \
            --exclude 'storage' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/node_stripe_payment_microservice/

      - name: Install dependencies and restart PM2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /var/www/node_stripe_payment_microservice
            pnpm install --prefer-frozen-lockfile --ignore-workspace
            pm2 restart ecosystem.config.js --env /var/www/node_stripe_payment_microservice/.env
            pm2 save
          EOF

      - name: Health check
        run: |
          sleep 10
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.DEPLOY_DOMAIN }}/storage/health)
          if [ $response -ne 200 ]; then
            echo "❌ Storage health check failed with status $response"
            exit 1
          fi
          echo "✅ Storage health check passed"